<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>circular. Segregation Hub • Floor Station</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            dark: '#0A3B2C',
                            primary: '#145743',
                            light: '#D4EBDC',
                            bg: '#F4F7F4',
                            border: '#E2ECE5',
                            grayText: '#62756C'
                        }
                    },
                    boxShadow: {
                        'card': '0 8px 30px rgba(10, 59, 44, 0.06)',
                        'float': '0 20px 40px rgba(10, 59, 44, 0.12)'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #e5e5e5;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }
        .app-container {
            max-width: 420px;
            margin: 0 auto;
            background-color: #F4F7F4;
            height: 100dvh;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        .view-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding-bottom: 96px;
        }
        .view-content::-webkit-scrollbar { display: none; }
        .view-content { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>

<div class="app-container">

    <!-- Top Sticky Header Bar (Identical to Household Panel) -->
    <header class="px-5 pt-6 pb-3.5 bg-white/90 backdrop-blur-md border-b border-brand-border flex items-center justify-between shrink-0 z-30">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-brand-dark text-emerald-300 flex items-center justify-center font-black text-sm shadow-xs border border-white/80">
                AS
            </div>
            <div>
                <h1 class="text-base font-black text-brand-dark tracking-tight leading-tight flex items-center gap-1.5">
                    <span>circular.</span>
                    <span class="text-[10px] font-extrabold uppercase px-1.5 py-0.5 rounded bg-brand-light text-brand-dark border border-brand-border">Hub</span>
                </h1>
                <div class="inline-flex items-center gap-1 text-[10px] font-bold text-emerald-800 mt-0.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-600 animate-pulse"></span> Shift A &middot; Scale Online
                </div>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <button onclick="loadData()" class="w-9 h-9 rounded-full bg-white border border-brand-border flex items-center justify-center text-brand-dark shadow-xs hover:bg-gray-50 active:scale-95 transition-transform" title="Refresh Data">
                <i class="ph-bold ph-arrows-clockwise text-sm"></i>
            </button>
            <a href="admin.html" target="_blank" class="w-9 h-9 rounded-full bg-white border border-brand-border flex items-center justify-center text-brand-dark shadow-xs hover:bg-gray-50 active:scale-95 transition-transform" title="Open Admin Panel">
                <i class="ph-bold ph-arrow-square-out text-sm"></i>
            </a>
        </div>
    </header>

    <!-- Scrollable View Content -->
    <main class="view-content px-5 pt-4" id="hub-content">
        <!-- Injected via JavaScript -->
    </main>

    <!-- Bottom Navigation Bar (Mirrored exactly from Household Panel) -->
    <nav class="absolute bottom-0 w-full bg-white/95 backdrop-blur-md border-t border-brand-border flex justify-around items-center py-2.5 pb-6 z-50 shadow-[0_-5px_15px_rgba(0,0,0,0.03)]">
        <button onclick="setTab('home')" id="nav-btn-home" class="flex flex-col items-center gap-1 text-brand-dark w-16 cursor-pointer">
            <i class="ph-fill ph-house text-2xl" id="nav-icon-home"></i>
            <span class="text-[10px] font-bold" id="nav-label-home">Home</span>
        </button>
        <button onclick="setTab('drop', 0)" id="nav-btn-drop" class="flex flex-col items-center gap-1 text-brand-grayText w-16 cursor-pointer">
            <i class="ph ph-scales text-2xl" id="nav-icon-drop"></i>
            <span class="text-[10px] font-medium" id="nav-label-drop">Weigh-in</span>
        </button>
        <button onclick="setTab('silos')" id="nav-btn-silos" class="flex flex-col items-center gap-1 text-brand-grayText w-16 cursor-pointer">
            <i class="ph ph-archive text-2xl" id="nav-icon-silos"></i>
            <span class="text-[10px] font-medium" id="nav-label-silos">Silos</span>
        </button>
        <button onclick="setTab('disp')" id="nav-btn-disp" class="flex flex-col items-center gap-1 text-brand-grayText w-16 cursor-pointer">
            <i class="ph ph-truck text-2xl" id="nav-icon-disp"></i>
            <span class="text-[10px] font-medium" id="nav-label-disp">Dispatches</span>
        </button>
        <button onclick="setTab('prof')" id="nav-btn-prof" class="flex flex-col items-center gap-1 text-brand-grayText w-16 cursor-pointer">
            <i class="ph ph-user text-2xl" id="nav-icon-prof"></i>
            <span class="text-[10px] font-medium" id="nav-label-prof">Profile</span>
        </button>
    </nav>

</div>

<script>
    const CLOUDFLARE_BACKEND = 'https://chess-richards-hugh-engineer.trycloudflare.com/api';
    let   API_BASE = window.location.protocol.startsWith('http') 
        ? `${window.location.origin}/api` 
        : 'http://localhost:3001/api';

    // Auto-detect Cloudflare Pages / external hosting and fallback if /api proxy isn't on same origin
    if (window.location.protocol.startsWith('http') && 
        window.location.hostname !== 'localhost' && 
        window.location.hostname !== '127.0.0.1' &&
        !window.location.hostname.includes('trycloudflare.com')) {
        fetch(`${API_BASE}/health`).then(res => {
            if (!res.ok) API_BASE = CLOUDFLARE_BACKEND;
        }).catch(() => {
            API_BASE = CLOUDFLARE_BACKEND;
        });
    }

    const MATERIALS = [
        'Paper', 'Cardboard', 'Plastic', 'Copper', 'Steel', 'Aluminium', 
        'Glass', 'Organic wet waste', 'E-waste', 'Landfill waste'
    ];

    let currentTab = 'home';
    let dropStep = 0;
    let selectedCollector = null;
    let isSegregated = true;
    let hubWeights = {}; // { material: kg }
    let lastDropoff = null;

    let summary = { today_dropoffs: 0, today_kg: 0, storage_stock_kg: 0, storage_capacity_kg: 0, weight_gaps: 0 };
    let recentTrips = [];
    let dispatches = [];
    let silos = [];
    let activeCollectors = [];

    async function loadData() {
        try {
            const [sumRes, tripsRes, dispRes, binsRes, queueRes] = await Promise.all([
                fetch(`${API_BASE}/hub/summary`).then(r => r.json()).catch(() => ({})),
                fetch(`${API_BASE}/hub/trips`).then(r => r.json()).catch(() => ({ trips: [] })),
                fetch(`${API_BASE}/hub/dispatches`).then(r => r.json()).catch(() => ({ dispatches: [] })),
                fetch(`${API_BASE}/hub/bins`).then(r => r.json()).catch(() => ({ bins: [] })),
                fetch(`${API_BASE}/hub/collectors-queue`).then(r => r.json()).catch(() => ({ collectors: [] }))
            ]);
            summary = sumRes || summary;
            recentTrips = tripsRes.trips || [];
            dispatches = dispRes.dispatches || [];
            silos = binsRes.bins || [];
            activeCollectors = queueRes.collectors || [];
            render();
        } catch (e) {
            console.error('Failed to load hub data:', e);
            render();
        }
    }

    function setTab(tab, step = 0) {
        currentTab = tab;
        dropStep = step;
        if (tab === 'drop' && step === 0) {
            selectedCollector = null;
            hubWeights = {};
        }

        const navTabs = ['home', 'drop', 'silos', 'disp', 'prof'];
        const iconClasses = {
            'home': ['ph ph-house', 'ph-fill ph-house'],
            'drop': ['ph ph-scales', 'ph-fill ph-scales'],
            'silos': ['ph ph-archive', 'ph-fill ph-archive'],
            'disp': ['ph ph-truck', 'ph-fill ph-truck'],
            'prof': ['ph ph-user', 'ph-fill ph-user']
        };

        navTabs.forEach(t => {
            const btn = document.getElementById(`nav-btn-${t}`);
            const icon = document.getElementById(`nav-icon-${t}`);
            const label = document.getElementById(`nav-label-${t}`);
            if (btn && icon && label) {
                if (t === tab) {
                    btn.className = 'flex flex-col items-center gap-1 text-brand-dark w-16 cursor-pointer';
                    icon.className = `${iconClasses[t][1]} text-2xl`;
                    label.className = 'text-[10px] font-bold';
                } else {
                    btn.className = 'flex flex-col items-center gap-1 text-brand-grayText w-16 cursor-pointer';
                    icon.className = `${iconClasses[t][0]} text-2xl`;
                    label.className = 'text-[10px] font-medium';
                }
            }
        });

        render();
    }

    function render() {
        const content = document.getElementById('hub-content');

        // ─────────────────────────────────────────────────────────────
        // 1. HOME VIEW (Overview matching Household dashboard)
        // ─────────────────────────────────────────────────────────────
        if (currentTab === 'home') {
            const tripRows = recentTrips.slice(0, 5).map(t => {
                const isFlagged = t.is_flagged === 1;
                const badge = isFlagged
                    ? `<span class="bg-red-50 text-red-700 border border-red-200 text-[10px] font-bold px-2 py-0.5 rounded-full flex items-center gap-1">
                         <i class="ph-bold ph-warning"></i> +${t.gap_pct}% Gap
                       </span>`
                    : `<span class="bg-emerald-50 text-emerald-800 border border-emerald-200 text-[10px] font-bold px-2 py-0.5 rounded-full flex items-center gap-1">
                         <i class="ph-bold ph-check"></i> Match (${t.gap_pct}%)
                       </span>`;

                return `
                    <div class="flex items-center justify-between p-3.5 bg-white rounded-2xl border border-brand-border shadow-xs">
                        <div class="min-w-0 pr-2">
                            <div class="flex items-center gap-1.5">
                                <span class="font-extrabold text-xs text-brand-dark truncate">${escHtml(t.collector_name || 'Partner')}</span>
                                <span class="text-[10px] font-mono text-gray-400">#${escHtml(t.id)}</span>
                            </div>
                            <p class="text-[11px] text-brand-grayText mt-0.5">${t.hub_weight || 0} kg &middot; ₹${t.payout_amount || 0} payout</p>
                        </div>
                        <div class="shrink-0">${badge}</div>
                    </div>
                `;
            }).join('');

            content.innerHTML = `
                <!-- Greeting & Shift Pill -->
                <div class="flex items-start justify-between mb-4">
                    <div>
                        <h2 class="text-xl font-black text-brand-dark tracking-tight">Good morning, Anil</h2>
                        <p class="text-xs text-brand-grayText font-medium">Patiala Segregation Hub &middot; Floor Terminal</p>
                    </div>
                    <div class="bg-white border border-brand-border px-2.5 py-1 rounded-full text-[11px] font-bold text-brand-dark shadow-xs flex items-center gap-1">
                        <i class="ph-fill ph-scales text-emerald-700"></i> Shift A
                    </div>
                </div>

                <!-- KPI Mini Cards -->
                <div class="grid grid-cols-2 gap-2.5 mb-4">
                    <div class="bg-white rounded-2xl p-3.5 border border-brand-border shadow-xs">
                        <span class="text-[10px] font-bold uppercase tracking-wider text-brand-grayText block mb-0.5">Drop-offs Today</span>
                        <div class="flex items-baseline gap-1">
                            <span class="text-2xl font-black text-brand-dark">${summary.today_dropoffs || 0}</span>
                            <span class="text-[10px] font-semibold text-brand-grayText">trips</span>
                        </div>
                    </div>
                    <div class="bg-white rounded-2xl p-3.5 border border-brand-border shadow-xs">
                        <span class="text-[10px] font-bold uppercase tracking-wider text-brand-grayText block mb-0.5">Received Today</span>
                        <div class="flex items-baseline gap-1">
                            <span class="text-2xl font-black text-emerald-800">${summary.today_kg || 0}</span>
                            <span class="text-[10px] font-semibold text-brand-grayText">kg</span>
                        </div>
                    </div>
                </div>

                <!-- Dark Green Hero CTA Card (Identical to Household "Ready for Pickup" card) -->
                <div class="bg-brand-dark rounded-3xl p-5 shadow-card relative overflow-hidden mb-5 text-white">
                    <div class="relative z-10">
                        <div class="flex items-center gap-2 text-white font-extrabold text-sm mb-1">
                            <i class="ph-bold ph-scales text-base text-emerald-300"></i> Weighbridge Check-in
                        </div>
                        <p class="text-white/80 text-xs mb-4 max-w-[240px] leading-relaxed">
                            Weigh incoming Kabadiwala scrap (Weight 2) and audit against doorstep receipts.
                        </p>
                        <button onclick="setTab('drop', 0)" class="bg-white text-brand-dark px-4 py-2.5 rounded-full font-bold text-xs flex items-center gap-2 hover:bg-gray-50 active:scale-95 transition-transform shadow-xs">
                            Start New Weigh-in <i class="ph-bold ph-arrow-right"></i>
                        </button>
                    </div>
                    <i class="ph-fill ph-recycle absolute -bottom-6 -right-6 text-9xl text-white/5 pointer-events-none"></i>
                </div>

                <!-- Recent Audits List Header -->
                <div class="flex items-center justify-between mb-2.5">
                    <h3 class="text-xs font-extrabold uppercase tracking-wider text-brand-grayText">Recent Hub Audit Logs</h3>
                    <button onclick="setTab('drop', 0)" class="text-xs font-bold text-emerald-800 hover:underline">+ New</button>
                </div>

                <div class="space-y-2 mb-6">
                    ${tripRows || '<div class="bg-white p-6 rounded-2xl border border-brand-border text-center text-xs text-brand-grayText">No drop-offs logged yet today.</div>'}
                </div>
            `;
            return;
        }

        // ─────────────────────────────────────────────────────────────
        // 2. WEIGH-IN / DROP-OFF VIEW
        // ─────────────────────────────────────────────────────────────
        if (currentTab === 'drop') {
            // STEP 0: Find Collector
            if (dropStep === 0) {
                content.innerHTML = `
                    <div class="mb-4">
                        <h2 class="text-xl font-black text-brand-dark tracking-tight">Weighbridge Check-in</h2>
                        <p class="text-xs text-brand-grayText font-medium">Step 1 of 2: Look up collector</p>
                    </div>

                    <div class="bg-white rounded-3xl p-5 border border-brand-border shadow-xs mb-4">
                        <label class="block text-[11px] font-bold text-brand-grayText uppercase tracking-wider mb-1.5">
                            Kabadiwala ID or Phone Number
                        </label>
                        <div class="flex gap-2 mb-2">
                            <input id="inp-kid" type="text" placeholder="e.g. KW-1011 or 7814776666" 
                                value="${selectedCollector?.employee_id || ''}"
                                onkeydown="if(event.key==='Enter') searchCollector()"
                                class="flex-1 bg-brand-bg border border-brand-border rounded-xl px-3.5 py-2.5 text-sm font-bold font-mono text-brand-dark focus:outline-none focus:border-brand-dark">
                            <button onclick="searchCollector()" class="bg-brand-dark text-white px-4 py-2.5 rounded-xl font-bold text-xs hover:opacity-90 active:scale-95 transition-transform flex items-center gap-1.5 shadow-xs">
                                <i class="ph-bold ph-magnifying-glass"></i> Find
                            </button>
                        </div>
                        <p id="kid-err" class="text-red-600 text-xs font-semibold min-h-[16px]"></p>

                        <div class="mt-4 pt-3 border-t border-brand-border">
                            <div class="flex items-center justify-between mb-2">
                                <span class="text-[11px] font-bold text-brand-grayText">⚡ Active Collectors at Station:</span>
                                <span class="text-[10px] text-brand-grayText font-mono">${activeCollectors.length} registered</span>
                            </div>
                            <div class="flex flex-col gap-2">
                                ${activeCollectors.map(c => {
                                    const hasPending = (c.pending_kg || 0) > 0;
                                    const badge = hasPending 
                                        ? `<span class="text-[10px] text-emerald-800 font-mono font-extrabold bg-emerald-100 border border-emerald-200 px-2 py-0.5 rounded-md">${c.pending_kg} kg pending</span>`
                                        : `<span class="text-[10px] text-gray-500 font-mono font-medium bg-gray-100 border border-gray-200 px-2 py-0.5 rounded-md">All deposited ✓</span>`;
                                    return `
                                    <button onclick="document.getElementById('inp-kid').value='${escHtml(c.employee_id || ('KW-' + c.id))}'; searchCollector();" 
                                        class="w-full text-left bg-brand-bg hover:bg-emerald-50 border border-brand-border p-2.5 rounded-xl flex items-center justify-between text-xs font-bold text-brand-dark transition-colors">
                                        <div class="flex items-center gap-2">
                                            <div class="w-6 h-6 rounded-full ${hasPending ? 'bg-emerald-100 text-emerald-800' : 'bg-gray-100 text-gray-500'} flex items-center justify-center text-xs">
                                                <i class="ph-bold ph-user"></i>
                                            </div>
                                            <div>
                                                <span>${escHtml(c.employee_id || ('KW-' + c.id))} (${escHtml(c.name)})</span>
                                                ${c.operating_area ? `<span class="block text-[9px] text-brand-grayText font-normal">${escHtml(c.operating_area)}</span>` : ''}
                                            </div>
                                        </div>
                                        ${badge}
                                    </button>
                                    `;
                                }).join('') || '<p class="text-xs text-brand-grayText py-2 text-center">No active collectors registered.</p>'}
                            </div>
                        </div>
                    </div>
                `;
                return;
            }

            // STEP 1: Doorstep Weight 1 Review & Lot Segregation
            if (dropStep === 1) {
                const c = selectedCollector.collector;
                const pickups = selectedCollector.pickups || [];
                const declaredTotal = selectedCollector.declared_total || 0;

                const hasPending = pickups.length > 0 && declaredTotal > 0;

                const pickupRows = pickups.map(p => `
                    <div class="flex items-center justify-between p-2.5 bg-brand-bg rounded-xl border border-brand-border text-xs mb-1.5">
                        <div class="min-w-0 pr-2">
                            <p class="font-bold text-brand-dark truncate">${escHtml(p.customer_address || 'Doorstep Customer')}</p>
                            <p class="text-[10px] text-brand-grayText truncate">${escHtml(p.material_weights || p.items || 'Scrap')}</p>
                        </div>
                        <span class="font-extrabold text-brand-dark text-xs font-mono shrink-0">${p.actual_weight || 0} kg</span>
                    </div>
                `).join('');

                const pendingContent = hasPending ? `
                    <!-- Doorstep Weight 1 Receipts Card -->
                    <div class="bg-white rounded-3xl p-4 border border-brand-border shadow-xs mb-4">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs font-bold text-brand-dark">Doorstep Declared (Weight 1)</span>
                            <span class="text-xs font-black text-emerald-800 font-mono">${declaredTotal} kg</span>
                        </div>
                        <div class="max-h-44 overflow-y-auto mb-2 pr-0.5">
                            ${pickupRows}
                        </div>
                    </div>

                    <!-- Lot Type Toggle -->
                    <div class="bg-white rounded-3xl p-4 border border-brand-border shadow-xs mb-5">
                        <label class="block text-xs font-bold text-brand-dark mb-2">Segregation Status</label>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="isSegregated=true; render();" 
                                class="p-3 rounded-2xl text-left border transition-all ${isSegregated ? 'bg-emerald-800 text-white border-emerald-800 shadow-xs' : 'bg-brand-bg text-brand-dark border-brand-border'}">
                                <div class="font-bold text-xs flex items-center gap-1">
                                    <i class="ph-bold ph-check"></i> Segregated
                                </div>
                                <span class="text-[10px] ${isSegregated ? 'text-emerald-200' : 'text-emerald-700'} font-semibold">+₹50 Bonus</span>
                            </button>
                            <button onclick="isSegregated=false; render();" 
                                class="p-3 rounded-2xl text-left border transition-all ${!isSegregated ? 'bg-gray-800 text-white border-gray-800 shadow-xs' : 'bg-brand-bg text-brand-dark border-brand-border'}">
                                <div class="font-bold text-xs flex items-center gap-1">
                                    <i class="ph-bold ph-shuffle"></i> Mixed Lot
                                </div>
                                <span class="text-[10px] text-gray-400 font-semibold">Standard Pay</span>
                            </button>
                        </div>
                    </div>

                    <button onclick="goToWeighbridgeStep()" 
                        class="w-full bg-brand-dark text-white font-bold py-3.5 rounded-full text-xs shadow-md active:scale-95 transition-all flex items-center justify-center gap-2">
                        <span>Continue to Hub Weighbridge</span>
                        <i class="ph-bold ph-arrow-right"></i>
                    </button>
                ` : `
                    <!-- Empty / Already Deposited State -->
                    <div class="bg-white rounded-3xl p-6 border border-brand-border shadow-xs text-center my-4 space-y-3">
                        <div class="w-12 h-12 rounded-full bg-emerald-100 text-emerald-800 flex items-center justify-center text-2xl mx-auto">
                            <i class="ph-bold ph-check-circle"></i>
                        </div>
                        <div>
                            <h3 class="font-black text-brand-dark text-sm">All Collections Deposited!</h3>
                            <p class="text-xs text-brand-grayText mt-1">This partner has <b>0 kg</b> pending scrap. All completed doorstep pickups have already been deposited into the silos.</p>
                        </div>
                        <button onclick="dropStep=0; selectedCollector=null; render();" 
                            class="bg-brand-bg hover:bg-gray-100 border border-brand-border text-brand-dark font-bold text-xs py-2.5 px-4 rounded-full transition-colors">
                            Look Up Another Collector
                        </button>
                    </div>

                    <button disabled 
                        class="w-full bg-gray-200 text-gray-400 font-bold py-3.5 rounded-full text-xs cursor-not-allowed flex items-center justify-center gap-2">
                        <span>No Pending Scrap to Weigh</span>
                    </button>
                `;

                content.innerHTML = `
                    <div class="flex items-center justify-between mb-3">
                        <div>
                            <h2 class="text-lg font-black text-brand-dark tracking-tight">${escHtml(c.name || 'Partner')}</h2>
                            <p class="text-[11px] text-brand-grayText font-mono">${c.employee_id || ('KW-' + c.id)} &middot; ${c.phone_number}</p>
                        </div>
                        <button onclick="dropStep=0; selectedCollector=null; render();" class="text-xs font-bold text-brand-grayText hover:text-brand-dark">
                            Change
                        </button>
                    </div>

                    ${pendingContent}
                `;
                return;
            }

            // STEP 2: Scale Weighing (Weight 2)
            if (dropStep === 2) {
                const c = selectedCollector.collector;
                const declTotal = selectedCollector.declared_total || 0;
                const hubTotal = getHubTotal();
                const totalDiff = Math.round((hubTotal - declTotal) * 10) / 10;
                const gap = declTotal > 0 ? (Math.abs(declTotal - hubTotal) / declTotal) : 0;
                const isFlagged = gap > 0.1;

                const declaredMap = calculateDeclaredMaterialWeights(selectedCollector);

                // Sort materials: items with declared weights come first
                const sortedMaterials = [...MATERIALS].sort((a, b) => {
                    const wtA = declaredMap[a] || 0;
                    const wtB = declaredMap[b] || 0;
                    return wtB - wtA;
                });

                const matInputs = sortedMaterials.map(m => {
                    const dec = declaredMap[m] || 0;
                    const cur = hubWeights[m] !== undefined ? hubWeights[m] : dec;
                    const diff = Math.round((cur - dec) * 10) / 10;
                    const hasDeclared = dec > 0;

                    let deltaBadge = '';
                    if (hasDeclared) {
                        if (diff === 0) {
                            deltaBadge = `<span class="inline-flex items-center gap-1 text-[10px] text-emerald-800 font-bold bg-emerald-50 px-2 py-0.5 rounded-md border border-emerald-200"><i class="ph-bold ph-check"></i> Exact match</span>`;
                        } else if (diff < 0) {
                            deltaBadge = `<span class="inline-flex items-center gap-1 text-[10px] text-amber-800 font-bold bg-amber-50 px-2 py-0.5 rounded-md border border-amber-200"><i class="ph-bold ph-trend-down"></i> ${diff} kg (Tare/Moisture)</span>`;
                        } else {
                            deltaBadge = `<span class="inline-flex items-center gap-1 text-[10px] text-blue-800 font-bold bg-blue-50 px-2 py-0.5 rounded-md border border-blue-200"><i class="ph-bold ph-trend-up"></i> +${diff} kg</span>`;
                        }
                    } else if (cur > 0) {
                        deltaBadge = `<span class="inline-flex items-center gap-1 text-[10px] text-purple-800 font-bold bg-purple-50 px-2 py-0.5 rounded-md border border-purple-200">+${cur} kg added</span>`;
                    }

                    return `
                    <div class="py-2.5 px-3 border-b border-brand-border last:border-0 ${hasDeclared ? 'bg-emerald-50/40 rounded-2xl mb-1.5 border border-emerald-100' : ''}">
                        <div class="flex items-center justify-between mb-1.5">
                            <div>
                                <span class="font-extrabold text-brand-dark text-xs">${m}</span>
                                ${hasDeclared ? `<span class="text-[10px] text-brand-grayText font-mono ml-1.5">(Doorstep: <b>${dec} kg</b>)</span>` : ''}
                            </div>
                            <div>
                                ${deltaBadge}
                            </div>
                        </div>
                        <div class="flex items-center justify-between gap-1">
                            <span class="text-[11px] font-bold text-brand-grayText">Hub Scale:</span>
                            <div class="flex items-center gap-1">
                                <button type="button" onclick="adjustWeight('${m}', -1)" title="Minus 1 kg" 
                                    class="w-7 h-7 bg-white hover:bg-emerald-100 border border-brand-border rounded-lg text-xs font-black text-brand-dark flex items-center justify-center active:scale-95 transition-transform shadow-xs">
                                    -1

                                <div class="relative flex items-center">

                                </div>

                }).join('');

                let gapBadge = '';
                if (hubTotal > 0) {
                    if (isFlagged) {
                        gapBadge = `<div class="bg-red-50 text-red-800 border border-red-200 text-xs font-bold p-2.5 rounded-xl flex items-center gap-2 mb-3">

                                <span class="block">⚠️ Gap ${Math.round(gap * 100)}% (Audit Alert)</span>

                    } else {
                        gapBadge = `<div class="bg-emerald-50 text-emerald-900 border border-emerald-200 text-xs font-bold p-2.5 rounded-xl flex items-center justify-between mb-3">

                content.innerHTML = `
                    <div class="flex items-center justify-between mb-2">
                        <div>
                            <h2 class="text-base font-black text-brand-dark">Hub Floor Weighbridge</h2>

                            <i class="ph-fill ph-lightning text-emerald-600"></i>
                            <span>Doorstep receipts preloaded</span>
                        </div>
                        <button onclick="resetToDoorstepWeights()" class="text-[11px] font-bold text-emerald-800 hover:text-emerald-950 underline flex items-center gap-1">
                            <i class="ph-bold ph-arrow-counter-clockwise"></i> Reset to Declared

                    <!-- Comparison Card -->
                    <div class="bg-brand-dark text-white rounded-3xl p-4 shadow-card mb-3 space-y-1.5 text-xs">
                        <div class="flex justify-between items-baseline">
                            <span class="text-white/80">Hub Scale Total (W2):</span>
                            <span class="text-lg font-black text-white font-mono" id="disp-hub-total">${hubTotal} kg</span>
                        </div>
                        <div class="flex justify-between items-baseline text-white/60 text-[11px]">
                            <span>Doorstep Declared (W1):</span>
                            <span class="font-mono font-bold">${declTotal} kg</span>
                        </div>
                    </div>

                    ${gapBadge}

                    <label class="flex items-center gap-2 cursor-pointer select-none mb-4 text-xs font-medium text-brand-dark">
                        <input type="checkbox" id="chk-confirm" onchange="checkCanStore()" class="w-4 h-4 rounded text-emerald-700">
                        <span><b>${escHtml(c.name)}</b> verified the scale reading.</span>
                    </label>

                    <button id="btn-store" disabled onclick="submitDropoff()"
                        class="w-full bg-brand-dark hover:bg-brand-primary disabled:opacity-40 disabled:cursor-not-allowed text-white font-bold py-3.5 rounded-full text-xs shadow-md active:scale-95 transition-all flex items-center justify-center gap-2">
                        <i class="ph-bold ph-check-circle text-base text-emerald-400"></i>
                        <span>Confirm &amp; Deposit to Silos</span>
                    </button>
                `;
                checkCanStore();
                return;
            }

            // STEP 3: Success Screen
            if (dropStep === 3) {
                content.innerHTML = `
                    <div class="bg-white rounded-3xl p-6 border border-brand-border shadow-xs text-center mt-2 mb-4">
                        <div class="w-14 h-14 rounded-full bg-emerald-100 text-emerald-800 flex items-center justify-center text-2xl font-black mx-auto mb-3">
                            <i class="ph-bold ph-check"></i>
                        </div>
                        <h3 class="text-lg font-black text-brand-dark">Drop-off Verified!</h3>
                        <p class="text-xs text-brand-grayText mt-0.5 mb-4">
                            Trip <span class="font-mono font-bold text-brand-dark">${lastDropoff.trip_id}</span> recorded in silos.
                        </p>

                        <div class="bg-brand-bg rounded-2xl p-4 text-left border border-brand-border mb-5 space-y-2 text-xs">
                            <div class="flex justify-between">
                                <span class="text-brand-grayText font-medium">Partner:</span>
                                <span class="font-bold text-brand-dark">${escHtml(lastDropoff.collector_name)}</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-brand-grayText font-medium">Hub Weight:</span>
                                <span class="font-bold text-brand-dark font-mono">${lastDropoff.hub_weight} kg</span>
                            </div>
                            <div class="flex justify-between items-center pt-2 border-t border-brand-border">
                                <span class="text-brand-dark font-bold">Settlement Payout:</span>
                                <span class="text-lg font-black text-emerald-800">₹${lastDropoff.payout}</span>
                            </div>
                        </div>

                        <div class="space-y-2">
                            <button onclick="setTab('drop', 0)" class="w-full bg-brand-dark text-white font-bold py-3.5 rounded-full text-xs shadow-xs active:scale-95 transition-transform">
                                + Next Weigh-in
                            </button>
                            <button onclick="setTab('home')" class="w-full bg-white border border-brand-border text-brand-dark font-bold py-3 rounded-full text-xs hover:bg-gray-50 active:scale-95 transition-transform">
                                Return to Floor Home
                            </button>
                        </div>
                    </div>
                `;
                return;
            }
        }

        // ─────────────────────────────────────────────────────────────
        // 3. SILOS VIEW
        // ─────────────────────────────────────────────────────────────
        if (currentTab === 'silos') {
            const siloCards = silos.map(s => {
                const pct = s.fill_pct || Math.min(100, Math.round((s.current_kg / s.capacity) * 100));
                const barColor = pct >= 80 ? 'bg-amber-500' : 'bg-emerald-700';

                return `
                    <div class="bg-white rounded-2xl p-4 border border-brand-border shadow-xs">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <h4 class="font-bold text-sm text-brand-dark leading-tight">${escHtml(s.material)}</h4>
                                <span class="text-[10px] text-brand-grayText font-mono">Silo #${s.id} &middot; ${escHtml(s.recycling_unit)}</span>
                            </div>
                            <span class="text-xs font-black text-brand-dark font-mono">${s.current_kg} <span class="text-[10px] text-gray-400 font-normal">/ ${s.capacity} kg</span></span>
                        </div>
                        <div class="w-full bg-gray-100 h-2 rounded-full overflow-hidden mb-1.5">
                            <div class="${barColor} h-full rounded-full transition-all duration-500" style="width: ${pct}%"></div>
                        </div>
                        <div class="flex justify-between items-center text-[10px] font-bold text-brand-grayText">
                            <span>${pct}% Filled</span>
                            <button onclick="setTab('disp')" class="text-emerald-800 hover:underline">Dispatch Lot &rarr;</button>
                        </div>
                    </div>
                `;
            }).join('');

            content.innerHTML = `
                <div class="flex items-center justify-between mb-3">
                    <div>
                        <h2 class="text-xl font-black text-brand-dark tracking-tight">Material Silos</h2>
                        <p class="text-xs text-brand-grayText font-medium">Live storage inventory &amp; capacity</p>
                    </div>
                    <span class="text-xs font-bold text-emerald-800 bg-emerald-50 border border-emerald-200 px-2.5 py-1 rounded-full">10 Silos</span>
                </div>
                <div class="space-y-2.5 mb-6">
                    ${siloCards || '<p class="text-xs text-gray-400 py-8 text-center">Loading silos…</p>'}
                </div>
            `;
            return;
        }

        // ─────────────────────────────────────────────────────────────
        // 4. DISPATCHES VIEW
        // ─────────────────────────────────────────────────────────────
        if (currentTab === 'disp') {
            const dispCards = dispatches.map(d => {
                const statusBadge = d.status === 'Planned'
                    ? '<span class="bg-amber-50 text-amber-800 border border-amber-200 text-[10px] font-bold px-2 py-0.5 rounded-full">Planned</span>'
                    : '<span class="bg-blue-50 text-blue-800 border border-blue-200 text-[10px] font-bold px-2 py-0.5 rounded-full">In transit</span>';

                return `
                    <div class="bg-white rounded-2xl p-4 border border-brand-border shadow-xs">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <span class="font-mono font-bold text-[11px] text-gray-400">${escHtml(d.id)}</span>
                                <h4 class="font-bold text-sm text-brand-dark">${escHtml(d.material)} (${d.weight_kg} kg)</h4>
                                <p class="text-[11px] text-brand-grayText mt-0.5">Dest: <b>${escHtml(d.recycling_unit)}</b></p>
                            </div>
                            ${statusBadge}
                        </div>
                        ${d.status === 'Planned' ? `
                            <button onclick="markLoaded('${d.id}')" class="w-full mt-2 bg-brand-bg hover:bg-emerald-50 border border-brand-border text-emerald-800 font-bold py-2 rounded-xl text-xs transition-colors">
                                <i class="ph-bold ph-check"></i> Mark Loaded into Truck
                            </button>
                        ` : ''}
                    </div>
                `;
            }).join('');

            content.innerHTML = `
                <div class="mb-3">
                    <h2 class="text-xl font-black text-brand-dark tracking-tight">Recycler Dispatches</h2>
                    <p class="text-xs text-brand-grayText font-medium">Direct shipments to industrial recyclers</p>
                </div>
                <div class="space-y-2.5 mb-6">
                    ${dispCards || '<p class="text-xs text-gray-400 py-8 text-center">No dispatches planned.</p>'}
                </div>
            `;
            return;
        }

        // ─────────────────────────────────────────────────────────────
        // 5. PROFILE VIEW
        // ─────────────────────────────────────────────────────────────
        if (currentTab === 'prof') {
            content.innerHTML = `
                <div class="mb-4">
                    <h2 class="text-xl font-black text-brand-dark tracking-tight">Operator Profile</h2>
                    <p class="text-xs text-brand-grayText font-medium">Floor station terminal details</p>
                </div>

                <div class="bg-white rounded-3xl p-5 border border-brand-border shadow-xs text-center mb-4">
                    <div class="w-16 h-16 rounded-full bg-brand-dark text-emerald-300 flex items-center justify-center font-black text-2xl mx-auto mb-2.5 shadow-xs">
                        AS
                    </div>
                    <h3 class="font-extrabold text-base text-brand-dark">Anil Sharma</h3>
                    <p class="text-xs text-brand-grayText font-medium">Weighbridge Operator &middot; Employee #E-201</p>
                    <span class="inline-block bg-emerald-50 text-emerald-800 text-[10px] font-bold px-3 py-1 rounded-full border border-emerald-200 mt-2">
                        Shift A (08:00 - 16:00 IST)
                    </span>
                </div>

                <div class="bg-white rounded-2xl p-4 border border-brand-border shadow-xs space-y-2.5 text-xs">
                    <div class="flex justify-between py-1 border-b border-brand-border">
                        <span class="text-brand-grayText font-medium">Hub Facility:</span>
                        <span class="font-bold text-brand-dark">Patiala Central Hub #1</span>
                    </div>
                    <div class="flex justify-between py-1 border-b border-brand-border">
                        <span class="text-brand-grayText font-medium">Floor Scale Calibration:</span>
                        <span class="font-bold text-emerald-700">Verified &amp; Online 🟢</span>
                    </div>
                    <div class="flex justify-between py-1 border-b border-brand-border">
                        <span class="text-brand-grayText font-medium">Floor Language:</span>
                        <span class="font-bold text-brand-dark">English / Hinglish</span>
                    </div>
                    <div class="flex justify-between py-1">
                        <span class="text-brand-grayText font-medium">Station Device:</span>
                        <span class="font-bold text-brand-dark font-mono">Terminal #HUB-01</span>
                    </div>
                </div>

                <div class="mt-4">
                    <a href="admin.html" target="_blank" class="w-full bg-white border border-brand-border text-brand-dark font-bold py-3.5 rounded-full text-xs flex items-center justify-center gap-2 hover:bg-gray-50 active:scale-95 transition-transform shadow-xs">
                        <i class="ph-bold ph-arrow-square-out text-sm"></i>
                        <span>Open Main Circular Admin Panel</span>
                    </a>
                </div>
            `;
        }
    }

    // Calculate doorstep declared weights per material from the collector's pickups
    function calculateDeclaredMaterialWeights(collectorData) {
        const declared = {};
        const pickups = collectorData?.pickups || [];
        
        pickups.forEach(p => {
            const breakdown = p.materials_breakdown || {};
            for (let [matName, wt] of Object.entries(breakdown)) {
                const w = parseFloat(wt) || 0;
                if (w <= 0) continue;
                
                const low = String(matName).toLowerCase().trim();
                let target = 'Cardboard';
                if (low.includes('cardboard') || low.includes('gatta') || low.includes('carton')) target = 'Cardboard';
                else if (low.includes('paper') || low.includes('raddi') || low.includes('newspaper')) target = 'Paper';
                else if (low.includes('plastic') || low.includes('bottle') || low.includes('pet')) target = 'Plastic';
                else if (low.includes('copper') || low.includes('tamba')) target = 'Copper';
                else if (low.includes('aluminium') || low.includes('aluminum')) target = 'Aluminium';
                else if (low.includes('steel') || low.includes('metal') || low.includes('iron') || low.includes('loha') || low.includes('brass')) target = 'Steel';
                else if (low.includes('glass')) target = 'Glass';
                else if (low.includes('organic') || low.includes('wet') || low.includes('food')) target = 'Organic wet waste';
                else if (low.includes('e-waste') || low.includes('ewaste') || low.includes('electronic')) target = 'E-waste';
                else if (MATERIALS.includes(matName)) target = matName;

                declared[target] = (declared[target] || 0) + w;
            }
        });

        // Round to 1 decimal place
        for (let k in declared) {
            declared[k] = Math.round(declared[k] * 10) / 10;
        }
        return declared;
    }

    function goToWeighbridgeStep() {
        if (!hubWeights || Object.keys(hubWeights).length === 0) {
            hubWeights = calculateDeclaredMaterialWeights(selectedCollector);
        }
        dropStep = 2;
        render();
    }

    function resetToDoorstepWeights() {
        hubWeights = calculateDeclaredMaterialWeights(selectedCollector);
        render();
    }

    function adjustWeight(mat, delta) {
        const declaredMap = calculateDeclaredMaterialWeights(selectedCollector);
        const dec = declaredMap[mat] || 0;
        const cur = hubWeights[mat] !== undefined ? hubWeights[mat] : dec;
        hubWeights[mat] = Math.max(0, Math.round((cur + delta) * 10) / 10);
        render();
    }

    async function searchCollector() {
        const inp = document.getElementById('inp-kid');
        const err = document.getElementById('kid-err');
        const q = inp.value.trim();
        if (!q) { err.textContent = 'Please enter a Kabadiwala ID.'; return; }

        err.textContent = 'Looking up records…';
        try {
            const res = await fetch(`${API_BASE}/hub/collector/${encodeURIComponent(q)}`);
            if (!res.ok) {
                const data = await res.json();
                err.textContent = data.error || 'No Kabadiwala found.';
                return;
            }
            selectedCollector = await res.json();
            hubWeights = calculateDeclaredMaterialWeights(selectedCollector);
            dropStep = 1;
            render();
        } catch (e) {
            err.textContent = 'Cannot reach hub server.';
        }
    }

    function setMatWeight(mat, val) {
        hubWeights[mat] = Math.max(0, parseFloat(val) || 0);
        checkCanStore();
        const hubTotal = getHubTotal();
        const totalEl = document.getElementById('disp-hub-total');
        if (totalEl) totalEl.textContent = `${hubTotal} kg`;
    }

    function getHubTotal() {
        return Math.round(Object.values(hubWeights).reduce((a, b) => a + (parseFloat(b) || 0), 0) * 10) / 10;
    }

    function checkCanStore() {
        const btn = document.getElementById('btn-store');
        const chk = document.getElementById('chk-confirm');
        if (btn && chk) {
            btn.disabled = !(getHubTotal() > 0 && chk.checked);
        }
    }

    async function submitDropoff() {
        const hubTotal = getHubTotal();
        const declTotal = selectedCollector.declared_total || 0;
        const c = selectedCollector.collector;

        const btn = document.getElementById('btn-store');
        if (btn) {
            btn.disabled = true;
            btn.innerHTML = `<i class="ph-bold ph-spinner animate-spin text-base"></i><span>Depositing to Silos…</span>`;
        }

        const pickupIds = (selectedCollector.pickups || []).map(p => p.id);

        try {
            const res = await fetch(`${API_BASE}/hub/dropoff`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    collector_id: c.id,
                    collector_name: c.name,
                    collector_phone: c.phone_number,
                    declared_weight: declTotal,
                    hub_weight: hubTotal,
                    is_segregated: isSegregated,
                    materials: hubWeights,
                    address_count: selectedCollector.pickups?.length || 1,
                    pickup_ids: pickupIds
                })
            });
            const data = await res.json();
            if (data.success) {
                lastDropoff = {
                    trip_id: data.trip_id,
                    payout: data.payout,
                    collector_name: c.name,
                    hub_weight: data.hub_weight,
                    is_flagged: data.is_flagged
                };
                // Clear the settled pickups from the current session
                selectedCollector.pickups = [];
                selectedCollector.declared_total = 0;
                hubWeights = {};
                dropStep = 3;
                loadData();
            } else {
                alert(data.error || 'Failed to record dropoff.');
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = `<i class="ph-bold ph-check-circle text-base text-emerald-400"></i><span>Confirm &amp; Deposit to Silos</span>`;
                }
            }
        } catch (e) {
            alert('Network error recording dropoff.');
            if (btn) {
                btn.disabled = false;
                btn.innerHTML = `<i class="ph-bold ph-check-circle text-base text-emerald-400"></i><span>Confirm &amp; Deposit to Silos</span>`;
            }
        }
    }

    async function markLoaded(id) {
        try {
            await fetch(`${API_BASE}/hub/dispatches/${id}/status`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: 'In transit' })
            });
            loadData();
        } catch (e) {
            alert('Failed to update dispatch.');
        }
    }

    function escHtml(str) {
        return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // Initial load
    loadData();
</script>
